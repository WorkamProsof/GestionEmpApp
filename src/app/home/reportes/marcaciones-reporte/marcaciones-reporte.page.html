<app-header titulo="Reporte de Marcaciones"></app-header>

<ion-content class="ion-padding">
  <ion-progress-bar *ngIf="cargando" type="indeterminate"></ion-progress-bar>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Filtros de consulta</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-grid>
        <ion-row>
          <ion-col size="12" sizeMd="6">
            <ion-item>
              <ion-label position="stacked">Desde</ion-label>
              <ion-input [(ngModel)]="filtros.desde" type="date"></ion-input>
            </ion-item>
          </ion-col>

          <ion-col size="12" sizeMd="6">
            <ion-item>
              <ion-label position="stacked">Hasta</ion-label>
              <ion-input [(ngModel)]="filtros.hasta" type="date"></ion-input>
            </ion-item>
          </ion-col>
        </ion-row>
      </ion-grid>

      <ion-button expand="block" fill="outline" (click)="consultar()">
        Consultar Reporte
      </ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Resultados</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list *ngIf="reporte.length > 0">
        <ion-item *ngFor="let item of reporte">
          <ion-avatar slot="start">
            <img [src]="obtenerFoto(item)" alt="Foto validación" (error)="onImageError($event)" />
          </ion-avatar>

          <ion-label>
            <p>Tipo: {{ item.TipoRegistro || 'N/D' }}</p>
            <p>Hora: {{ item.Fecha ? (item.Fecha | date:'dd/MM/yyyy HH:mm') : 'Sin dato' }}</p>
          </ion-label>
        </ion-item>
      </ion-list>

      <ion-text color="medium" *ngIf="reporte.length === 0">
        No existen datos para los filtros seleccionados.
      </ion-text>
    </ion-card-content>
  </ion-card>
</ion-content>
