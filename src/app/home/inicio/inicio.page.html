<app-header titulo="Inicio"></app-header>

<ion-content [fullscreen]="true">
  <!-- Header con imagen -->
  <div class="hero">
    <img
      class="hero__image"
      src="assets/images/Cocora2.png"
      alt="Encabezado de bienvenida"
    />
    <div class="hero__overlay"></div>
    <div class="hero__content">
      <p class="hero__greeting">Bienvenido</p>
      <h1 class="hero__title">{{ datosUsuario?.nombre }}</h1>
    </div>
  </div>

  <!-- Cuadrícula de módulos tipo escritorio de celular -->
  <section class="modules">
	<div class="module" *ngFor="let module of modules">
		<button
		  type="button"
		  class="module__button ion-activatable"
		  (click)="openModule(module)"
		  *ngIf="validarPermiso(module.permisoId)"
		>
		  <span class="module__icon" [style.background]="module.color">
			<ion-icon [name]="module.icon" aria-hidden="true"></ion-icon>
		  </span>
		  <span class="module__label">{{ module.title }}</span>
		  <ion-ripple-effect></ion-ripple-effect>
		</button>
	</div>
  </section>
</ion-content>
